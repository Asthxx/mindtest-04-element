<html lang="zh-CN">
<head>

/* ========== 基础与配色：柔和轻快，纸感暖白 + 墨绿 / 暖橙 ========== */
:root{
  --bg1:#fdfaf5; --bg2:#f4eee4;
  --ink:#2f2e2c; --sub:#6d6a64;
  --green:#5a6f9c; --green-d:#425584; --green-l:#e9edf6;
  --orange:#8fa9d9; --seal:#6b7fb5;
  --card:rgba(255,255,255,.78); --line:rgba(58,107,92,.16);
  --shadow:0 8px 30px rgba(58,107,92,.09);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink);background:var(--bg1);min-height:100vh;line-height:1.6;
  display:flex;justify-content:center;overflow-x:hidden;
}
/* 柔和背景光晕 */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:

    radial-gradient(50% 40% at 88% 18%,rgba(58,107,92,.13),transparent 70%),
    radial-gradient(60% 50% at 50% 100%,rgba(192,85,63,.08),transparent 70%),
    linear-gradient(160deg,#fdfaf5,#f4eee4);
}
.wrap{position:relative;z-index:1;width:100%;max-width:640px;padding:20px 18px 48px;min-height:100vh}

/* 页面切换 */
.page{display:none;animation:fade .4s ease both}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;
  box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn{cursor:pointer;border:none;font-family:inherit;font-weight:700;transition:transform .14s,box-shadow .2s,opacity .2s}
.btn:active{transform:scale(.98)}
.primary{width:100%;padding:15px;font-size:16px;color:#fff;border-radius:14px;
  background:linear-gradient(100deg,var(--green),var(--green-d));box-shadow:0 8px 22px rgba(58,107,92,.28)}
.ghost{background:var(--green-l);color:var(--green-d);border:1px solid var(--line);
  border-radius:12px;padding:12px 18px;font-size:14px}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.muted{color:var(--sub);font-size:13px}

/* ========== 首页 ========== */
.hero{margin-top:26px;padding:34px 24px 30px;text-align:center;position:relative;overflow:hidden}
.seal{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;
  border-radius:12px;background:var(--seal);color:#fff;font-size:15px;font-weight:800;
  letter-spacing:2px;box-shadow:0 6px 16px rgba(192,85,63,.28);margin-bottom:18px;transform:rotate(-4deg)}
.hero h1{font-size:clamp(24px,6.5vw,32px);line-height:1.45;font-weight:800;color:var(--green-d);letter-spacing:.5px}
.hero h1 .em{color:var(--orange)}
.hero .lead{margin-top:16px;font-size:14px;color:var(--sub);line-height:1.9}
.hero .tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:20px 0 6px}
.hero .tags span{font-size:12px;padding:6px 11px;border-radius:999px;background:var(--green-l);
  color:var(--green-d);font-weight:600}
.hero .note{margin-top:18px;font-size:12px;color:var(--sub);line-height:1.8}
.start{margin-top:24px}

/* ========== 答题页 ========== */
.qtop{padding:8px 2px 0}
.qtop .row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--sub)}
.qtop .row b{font-size:20px;color:var(--green-d);font-weight:800}
.bar{height:7px;border-radius:99px;background:rgba(58,107,92,.12);overflow:hidden;margin:10px 0 22px}
.bar i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--orange),var(--green));transition:width .3s ease}
.qcard{padding:24px 20px}
.qindex{font-size:12px;color:var(--orange);font-weight:800;letter-spacing:1px}
.qtext{font-size:clamp(18px,4.6vw,21px);font-weight:700;line-height:1.55;margin:10px 0 20px;color:var(--green-d)}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{width:100%;text-align:left;display:flex;gap:12px;align-items:flex-start;padding:15px 14px;
  border-radius:14px;background:#fff;border:1px solid var(--line);color:var(--ink);
  font-size:14px;line-height:1.55;font-weight:600;box-shadow:0 3px 10px rgba(58,107,92,.05);
  transition:border-color .15s,background .15s,transform .12s}
.opt:hover{border-color:var(--green)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--green-l);
  color:var(--green-d);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.opt.sel{border-color:var(--green);background:var(--green-l);transform:scale(.99)}
.opt.sel .k{background:var(--green);color:#fff}
.qnav{display:flex;gap:10px;margin-top:20px}
.qnav .btn{flex:1}
.qnav .primary{flex:1.4}
.hint{text-align:center;font-size:11px;color:var(--sub);margin-top:14px}

/* ========== 结果页 ========== */

.rhead .ico{font-size:40px;line-height:1}
.rhead .kicker{font-size:12px;color:var(--sub);letter-spacing:2px;margin-top:12px}
.rhead .name{font-size:clamp(28px,7vw,36px);font-weight:800;color:var(--green-d);margin-top:6px;letter-spacing:1px}
.rhead .title{font-size:14px;color:var(--orange);font-weight:700;margin-top:4px}
.match{display:inline-block;margin-top:14px;padding:7px 15px;border-radius:999px;font-size:13px;font-weight:800;
  background:var(--green-l);color:var(--green-d);border:1px solid var(--line)}
.rsec{margin-top:16px;padding:20px}
.rsec h3{font-size:14px;color:var(--green);font-weight:800;margin-bottom:12px;letter-spacing:.5px}
.rsec h3 .n{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:7px;
  background:var(--green);color:#fff;font-size:12px;margin-right:8px}
.rsec p{font-size:14px;line-height:2;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

.slogan{margin-top:16px;padding:18px;text-align:center;border-radius:14px;
  background:var(--green-d);color:#fff;font-size:16px;font-weight:800;line-height:1.7;letter-spacing:.5px}
.share{margin-top:16px;padding:16px}
.share .lbl{font-size:13px;color:var(--green);font-weight:800;margin-bottom:8px}
.share .txt{font-size:13px;line-height:1.9;color:var(--ink);white-space:pre-wrap}
.racts{display:flex;gap:10px;margin-top:16px}
.racts .btn{flex:1}
.foot{text-align:center;font-size:11px;color:var(--sub);margin-top:24px;line-height:1.8}

/* Toast */
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(16px);opacity:0;
  background:var(--green-d);color:#fff;padding:11px 20px;border-radius:999px;font-size:13px;
  font-weight:700;transition:.28s;z-index:99;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.15)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:380px){
  .wrap{padding:16px 14px 40px}
  .hero{padding:28px 18px 26px}

</style>
</head>

/* =========================================================
   状态与工具
   ========================================================= */
let cur = 0;
let answers = new Array(Q.length).fill(null);

const $ = id => document.getElementById(id);
const show = id => {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('on'));
  $(id).classList.add('on');
  window.scrollTo({top:0, behavior:'instant'});
};
function toast(msg){
  const t = $('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('on'), 1800);
}

/* =========================================================
   答题流程
   ========================================================= */
function render(){
  const item = Q[cur];
  const done = answers.filter(x=>x!==null).length;
  $('qnum').textContent = done;
  $('barFill').style.width = (done / Q.length * 100) + '%';
  $('qindex').textContent = 'QUESTION ' + String(cur+1).padStart(2,'0');
  $('qtext').textContent = item.q;
  $('opts').innerHTML = item.opts.map((o,i)=>
    `<button class="opt ${answers[cur]===i?'sel':''}" data-i="${i}">
       <span class="k">${'ABCD'[i]}</span><span>${o.x}</span>
     </button>`).join('');

  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click',()=>{
      answers[cur] = +btn.dataset.i;
      document.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel'));
      btn.classList.add('sel');
      $('nextBtn').disabled = false;
      if(cur < Q.length-1){
        clearTimeout(window._auto);
        window._auto = setTimeout(()=>{ if(cur<Q.length-1) go(1); }, 360);
      }
    });
  });

  $('prevBtn').disabled = cur === 0;
  $('nextBtn').disabled = answers[cur] === null;
  $('nextBtn').textContent = cur === Q.length-1 ? '揭晓结果' : '下一题';
}
function go(step){
  clearTimeout(window._auto);
  const next = cur + step;
  if(next < 0 || next >= Q.length) return;
  cur = next; render();
}
$('startBtn').addEventListener('click',()=>{cur=0;answers.fill(null);render();show('p-quiz');});
$('prevBtn').addEventListener('click',()=>go(-1));
$('nextBtn').addEventListener('click',()=>{
  if(cur===Q.length-1) result();
  else go(1);
});

/* =========================================================
   计分：维度累加 → 中心化余弦相似度比对 → 取最匹配
   用"相对高低模式"匹配，避免中间型人物通吃
   ========================================================= */
const center = v => {
  const m = DIMS.reduce((s,d)=>s+v[d.k],0)/DIMS.length;
  return DIMS.map(d=>v[d.k]-m);
};
const cosine = (a,b) => {
  let dot=0,na=0,nb=0;
  for(let i=0;i<a.length;i++){ dot+=a[i]*b[i]; na+=a[i]*a[i]; nb+=b[i]*b[i]; }
  return dot/(Math.sqrt(na*nb)||1);
};
const HERO_C = HEROES.map(h=>({h, c:center(h.vec)}));

function result(){
  const score = {};
  DIMS.forEach(d=>score[d.k]=50);
  answers.forEach((idx,i)=>{
    if(idx===null) return;
    const d = Q[i].opts[idx].d;
    for(const k in d) score[k] += d[k];
  });

  const uc = center(score);
  let best = HEROES[0], bestSim = -Infinity;
  HERO_C.forEach(({h,c})=>{
    const sim = cosine(uc,c);
    if(sim > bestSim){ bestSim = sim; best = h; }
  });
  const match = Math.max(80, Math.min(98, Math.round(78 + bestSim * 20)));

  $('rIco').textContent = best.ico;
  $('rName').textContent = best.name;
  $('rTitle').textContent = best.title;
  $('rMatch').textContent = '灵魂契合度 ' + match + '%';
  $('rWhy').textContent = best.why;
  $('rChips').innerHTML = best.chips.map(c=>`<span># ${c}</span>`).join('');
  $('rEgg').textContent = best.egg;
  $('rSlogan').textContent = '「' + best.slogan + '」';
  const share = '我的本命元素是【' + best.name + '】' + best.ico + '\n' +
                best.title + '｜契合度 ' + match + '%\n' +
                best.slogan + '\n' +
                '👉 来测测你的本命元素？#元素人格测试';
  $('rShare').textContent = share;
  $('copyBtn')._text = share;

  show('p-result');
}

/* =========================================================
   分享 / 重测
   ========================================================= */
$('copyBtn').addEventListener('click',async()=>{
  const text = $('copyBtn')._text || '';
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
    }else{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
    toast('文案已复制，发给朋友比比看');
  }catch(e){ toast('复制失败，请长按手动复制'); }
});
$('againBtn').addEventListener('click',()=>{cur=0;answers.fill(null);render();show('p-quiz');});
</script>
